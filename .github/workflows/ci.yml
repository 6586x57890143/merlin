name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    # internal/settings and internal/storage are Postgres-backed and were,
    # until this service was added, tested only by hand: the schema itself
    # (18 migrations, including a CHECK constraint) and the Store that every
    # authorization decision in the bot reads from had never been run
    # against a real database in CI. internal/dbtest reads TEST_DATABASE_URL
    # and skips its tests (not fails) if it's unset, so this service is what
    # turns those tests on here without requiring one for local development.
    # postgres:16-alpine matches the image docker-compose.yml and
    # docker-compose.prod.yml actually run in production.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: merlin
          POSTGRES_PASSWORD: merlin
          POSTGRES_DB: merlin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://merlin:merlin@localhost:5432/merlin_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

      - name: go test (race + cover)
        run: go test ./... -race -cover -covermode=atomic -coverprofile=coverage.out

      # Reads the profile the step above already produced, so this is
      # arithmetic rather than a second test run. See the script for why the
      # floor applies to plugins and how the baseline works.
      - name: plugin coverage floor
        run: scripts/coverage-floor.sh coverage.out

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  secret-scan:
    runs-on: ubuntu-latest
    # Scoped per-job rather than inheriting the workflow defaults: on a
    # pull_request event gitleaks scans the PR's commits via
    # GET /repos/{owner}/{repo}/pulls/{n}/commits, which needs
    # pull-requests: read. Without it the job dies with a 403 "Resource not
    # accessible by integration" and reports a red secret-scan that has
    # nothing to do with any secret. It never showed up before because every
    # earlier run was a push to main, where gitleaks reads git history
    # directly and never calls that endpoint. Declaring the job's own
    # permissions also drops the packages: write it inherited and never used.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prose:
    runs-on: ubuntu-latest
    # Em dashes, ellipsis characters and curly quotes are the punctuation
    # nobody types on a keyboard, so they read as machine written wherever
    # they appear: command responses, embeds, docs, code comments. They were
    # removed once in bulk; without something watching, the next feature just
    # reintroduces them a few at a time. Cheap enough to run on its own job so
    # a prose failure reports separately from a compile or test failure.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: No generated-text punctuation
        run: |
          # Patterns are written as UTF-8 byte escapes, not literal
          # characters, so this file does not trip its own check. Octal
          # rather than $'\uXXXX' because \u needs bash 4.2+ and silently
          # passes the literal text "\u2014" through as the pattern on shells
          # without it, which matches nothing real and quietly disarms the
          # guard. -I skips binaries so the embedded brand PNGs, whose
          # compressed bytes contain these sequences by chance, never match.
          # spec.MD is exempt: it is the original hand-written design
          # document, not generated prose, and is treated as fixed history.
          em=$'\342\200\224' ell=$'\342\200\246'
          ldq=$'\342\200\234' rdq=$'\342\200\235'
          if grep -rnI --exclude-dir=.git --exclude=spec.MD \
               -e "$em" -e "$ell" -e "$ldq" -e "$rdq" . ; then
            echo "::error::Found em dashes, ellipsis characters or curly quotes at the locations above. Use plain punctuation: a colon, comma, full stop, or parentheses, whichever the sentence actually wants."
            exit 1
          fi

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: merlin:ci

  push-image:
    needs: [lint-test, secret-scan, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/6586x57890143/merlin:latest
            ghcr.io/6586x57890143/merlin:${{ github.sha }}

  deploy:
    needs: push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Copy prod compose file to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/deploy/merlin"
      - name: Pull image and restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -e
            cd /home/deploy/merlin
            mkdir -p backups

            # Record the tag being deployed before deploying it, and keep the
            # one it replaces. Rolling back is then reading a file, not
            # digging through GHCR or CI logs to work out what was running.
            if [ -f deployed-tag.env ]; then
              cp deployed-tag.env previous-tag.env
            fi
            echo "MERLIN_IMAGE_TAG=$IMAGE_TAG" > deployed-tag.env

            set -a
            . ./deployed-tag.env
            set +a

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            # Prune dangling layers only. A bare `docker image prune -f` on a
            # host that has just retagged images can remove the previous
            # release, which is the one thing a rollback needs to still exist.
            docker image prune -f --filter "until=168h"
            docker logout ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
