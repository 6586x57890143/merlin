name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: go test (race + cover)
        run: go test ./... -race -cover -covermode=atomic

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  secret-scan:
    runs-on: ubuntu-latest
    # Scoped per-job rather than inheriting the workflow defaults: on a
    # pull_request event gitleaks scans the PR's commits via
    # GET /repos/{owner}/{repo}/pulls/{n}/commits, which needs
    # pull-requests: read. Without it the job dies with a 403 "Resource not
    # accessible by integration" and reports a red secret-scan that has
    # nothing to do with any secret. It never showed up before because every
    # earlier run was a push to main, where gitleaks reads git history
    # directly and never calls that endpoint. Declaring the job's own
    # permissions also drops the packages: write it inherited and never used.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: merlin:ci

  push-image:
    needs: [lint-test, secret-scan, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/6586x57890143/merlin:latest
            ghcr.io/6586x57890143/merlin:${{ github.sha }}

  deploy:
    needs: push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy prod compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/deploy/merlin"
      - name: Pull image and restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -e
            cd /home/deploy/merlin
            mkdir -p backups

            # Record the tag being deployed before deploying it, and keep the
            # one it replaces. Rolling back is then reading a file, not
            # digging through GHCR or CI logs to work out what was running.
            if [ -f deployed-tag.env ]; then
              cp deployed-tag.env previous-tag.env
            fi
            echo "MERLIN_IMAGE_TAG=$IMAGE_TAG" > deployed-tag.env

            set -a
            . ./deployed-tag.env
            set +a

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            # Prune dangling layers only. A bare `docker image prune -f` on a
            # host that has just retagged images can remove the previous
            # release, which is the one thing a rollback needs to still exist.
            docker image prune -f --filter "until=168h"
            docker logout ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
