<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>contest</title>

<!--
  One page, every contest. The slug comes out of the URL and the content out
  of /api/c/<slug>/view, so there is nothing to template server side and one
  document to cache.

  No framework and no build step, matching web/lab. Everything below is hand
  written CSS: the wobble is a border-radius trick, the collage is six PNGs
  merlin already ships as her own mood icons, and the headline is spans with
  a seeded rotation. Nothing is generated, nothing is a gradient, nothing is
  frosted glass.

  Dark mode is one media query and it works because of how the palette is
  built: everything is drawn as ink outlines on paper, with the marker
  colours as fills. Swap paper and ink and the markers still read.
-->

<style>
:root {
  color-scheme: light dark;

  /* Marker pens. The same six in both themes on purpose: a felt tip reads
     on white paper and on a blackboard, which is the whole trick that makes
     the dark mode below three lines long. */
  --red:    #e5372a;
  --orange: #f08c1e;
  --yellow: #f2c230;
  --green:  #3aa34a;
  --blue:   #2f6fd0;
  --purple: #8b3fbf;

  --paper: #fdfbf6;
  --card:  #ffffff;
  --ink:   #17150f;
  --muted: #6b6459;
  --shadow: rgba(23, 21, 15, .18);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #16150f;
    --card:  #1e1c15;
    --ink:   #f0ece2;
    --muted: #98918a;
    --shadow: rgba(0, 0, 0, .5);
  }
}

@font-face {
  font-family: 'Nunito';
  src: url('/fonts/nunito-latin.woff2') format('woff2');
  font-weight: 700 900;
  font-display: swap;
}
@font-face {
  font-family: 'Marker';
  src: url('/fonts/marker-latin.woff2') format('woff2');
  font-weight: 400;
  font-display: swap;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

h1, h2, .chip, button {
  font-family: 'Nunito', ui-rounded, ui-sans-serif, system-ui, sans-serif;
  font-weight: 900;
}

main {
  max-width: 62rem;
  margin: 0 auto;
  padding: 1.5rem 1rem 8rem;
  position: relative;
  z-index: 1;
}

/* The collage. Absolutely positioned, decorative, and gone on a phone where
   the screen is the content and a sticker over it is just in the way. */
.stickers { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.stickers img { position: absolute; width: 88px; opacity: .5; }
@media (max-width: 900px) { .stickers { display: none; } }

/* The cloud behind the title. One inline SVG path, filled with the blue
   marker at low opacity so it sits under the letters rather than fighting
   them. */
header { position: relative; text-align: center; padding: 2rem 0 1rem; }
header svg.blob {
  position: absolute; left: 50%; top: 50%;
  width: min(46rem, 108%); transform: translate(-50%, -52%);
  fill: var(--blue); opacity: .22; z-index: -1;
}

h1 { margin: 0; font-size: clamp(2.4rem, 9vw, 5rem); line-height: .95; letter-spacing: -.01em; }
h1 span { display: inline-block; font-family: 'Marker', 'Nunito', cursive; }
h1 .sp { width: .35em; }

.theme { margin: .75rem auto 0; max-width: 34rem; color: var(--muted); }
.clock { margin: .5rem 0 0; font-weight: 700; }

h2 {
  font-size: 1.15rem; margin: 2.25rem 0 .85rem;
  text-transform: lowercase; letter-spacing: .01em;
}

/* Wobble. Two irregular radii on one element read as a marker outline
   without a single image, and the alternating tilt below is what stops a
   grid of them looking like a grid. */
.wobble {
  border: 3px solid var(--ink);
  border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
  background: var(--card);
}

.grid {
  display: grid; gap: 1.25rem;
  grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
}

.card {
  position: relative;
  padding: .7rem;
  text-align: left; width: 100%;
  color: inherit; font: inherit; cursor: pointer;
  box-shadow: 3px 3px 0 var(--shadow);
  transition: transform .12s ease, box-shadow .12s ease;
}
.card:nth-child(odd)  { transform: rotate(-1.3deg); }
.card:nth-child(even) { transform: rotate(.9deg); }
.card:hover, .card:focus-visible { transform: rotate(0); box-shadow: 5px 5px 0 var(--shadow); }
.card:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.card[disabled] { cursor: default; }

.card figure { margin: 0; }
.card img.art, .card video {
  display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover;
  border-radius: 12px; background: var(--paper);
}
.card audio { width: 100%; margin: .5rem 0; }
.card .body {
  margin: .25rem 0 0; white-space: pre-wrap; overflow: hidden;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; line-clamp: 6;
}
.card .name { font-weight: 700; margin: .5rem 0 0; }
.card .by { color: var(--muted); font-size: .9rem; }

.card[aria-pressed="true"] {
  border-color: var(--green);
  box-shadow: 0 0 0 3px var(--green), 4px 4px 0 var(--shadow);
}
.card[aria-pressed="true"]::after {
  content: "picked";
  position: absolute; top: -.65rem; right: -.4rem;
  background: var(--green); color: #fff;
  font-family: 'Marker', cursive; font-size: .95rem;
  padding: .05rem .55rem; border-radius: 40% 60% 45% 55% / 55% 45% 60% 40%;
  transform: rotate(6deg);
}

.rank {
  position: absolute; top: -.9rem; left: -.7rem;
  width: 2.2rem; height: 2.2rem; display: grid; place-items: center;
  background: var(--yellow); color: #17150f;
  font-family: 'Marker', cursive; font-size: 1.2rem;
  border: 3px solid var(--ink);
  border-radius: 48% 52% 55% 45% / 55% 48% 52% 45%;
  transform: rotate(-8deg);
}
.card.win { border-color: var(--yellow); box-shadow: 0 0 0 4px var(--yellow), 4px 4px 0 var(--shadow); }
.votes { font-family: 'Marker', cursive; font-size: 1.05rem; }

.prize { padding: .6rem .85rem; margin-bottom: .7rem; box-shadow: 3px 3px 0 var(--shadow); }
.prize:nth-child(odd) { transform: rotate(-.6deg); }
.prize b { display: block; }
.prize small { color: var(--muted); }

.chip {
  display: inline-block; padding: .3rem .8rem; margin: 0 .35rem .35rem 0;
  border: 3px solid var(--ink); background: var(--card);
  border-radius: 40% 60% 50% 50% / 60% 40% 60% 40%;
  text-decoration: none; color: inherit; font-size: .95rem;
}
.chip:hover { background: var(--yellow); color: #17150f; }

/* The bar. Fixed, because it is the answer to "how many have i picked" and
   that question comes up while scrolling. */
.bar {
  position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%);
  display: none; align-items: center; gap: .75rem; z-index: 5;
  padding: .55rem 1.1rem; box-shadow: 4px 4px 0 var(--shadow);
  max-width: calc(100vw - 2rem);
}
.bar.on { display: flex; }
.bar .dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--green); }
.bar .dot.busy { background: var(--yellow); }
.bar .dot.bad  { background: var(--red); }

.note { color: var(--muted); }
.empty { padding: 2rem 0; text-align: center; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .card, .prize, .rank, .card[aria-pressed="true"]::after,
  .stickers img, h1 span { transform: none !important; }
  .card { transition: none; }
}
</style>
</head>
<body>

<div class="stickers" aria-hidden="true"></div>

<main>
  <header>
    <svg class="blob" viewBox="0 0 600 200" aria-hidden="true">
      <path d="M62 116C22 104 26 62 66 52c10-28 52-36 74-18 22-24 74-26 94-2 30-16 74-6 82 20 34 2 52 34 34 58 12 26-14 52-48 48-16 22-60 26-82 8-24 20-72 18-90-6-28 12-64 0-68-24z"/>
    </svg>
    <h1 id="title"></h1>
    <p class="theme" id="theme" hidden></p>
    <p class="clock" id="clock"></p>
    <p id="links"></p>
  </header>

  <section id="prizesWrap" hidden>
    <h2>on the table</h2>
    <div id="prizes"></div>
  </section>

  <section id="entriesWrap" hidden>
    <h2 id="entriesHead">entries</h2>
    <div class="grid" id="grid"></div>
  </section>

  <p class="empty" id="empty"></p>
</main>

<div class="bar wobble" id="bar" role="status">
  <span class="dot" id="dot"></span>
  <span id="barText"></span>
</div>

<script>
"use strict";

const slug = (location.pathname.match(/\/c\/([a-z2-7]+)/) || [])[1] || "";

// Who is voting comes from a Discord OAuth session cookie the Worker set,
// never from anything in this URL. The page asks /me on load; the cookie
// itself is HttpOnly, so nothing here can read or forward it.
let me = { signed_in: false };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

// Only http(s) links from the snapshot are ever put in an href. The text
// comes from members, and a javascript: URL in an entry body would otherwise
// be one click from running here.
const safeURL = (u) => (/^https?:\/\//i.test(u || "") ? u : "");

// Seeded RNG so the headline is scribbled the same way every time this
// contest is opened, and differently from the next one. A random tilt on
// every load would read as a page that cannot sit still.
function seeded(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function () {
    h += 0x6D2B79F5; let t = h;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const PENS = ["--red", "--orange", "--yellow", "--green", "--blue", "--purple"];

function drawTitle(text) {
  const rnd = seeded(slug || text);
  $("title").innerHTML = [...text].map((ch) => {
    if (ch === " ") return '<span class="sp"></span>';
    const rot = (rnd() * 16 - 8).toFixed(1);
    const dy = (rnd() * 8 - 4).toFixed(1);
    const pen = PENS[Math.floor(rnd() * PENS.length)];
    return `<span style="transform:rotate(${rot}deg) translateY(${dy}px);color:var(${pen})">${esc(ch)}</span>`;
  }).join("");
}

function drawStickers() {
  const rnd = seeded("stickers:" + slug);
  const names = ["ok", "warn", "info", "notice", "idle", "error"];
  const spots = [[3, 12], [88, 8], [6, 62], [90, 55], [2, 86], [92, 84]];
  const box = document.querySelector(".stickers");
  box.innerHTML = names.map((n, i) => {
    const [x, y] = spots[i];
    const rot = (rnd() * 30 - 15).toFixed(1);
    return `<img src="/stickers/merlin_${n}.png" alt="" loading="lazy"
             style="left:${x}%;top:${y}%;transform:rotate(${rot}deg)">`;
  }).join("");
}

// Durations in prose, because everything a member reads on this page is
// prose. "3h 12m" is for a log line.
function human(sec) {
  if (sec <= 0) return "any second now";
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  if (d) return d + (d === 1 ? " day" : " days") + (h ? " and " + h + (h === 1 ? " hour" : " hours") : "");
  if (h) return h + (h === 1 ? " hour" : " hours") + (m ? " and " + m + (m === 1 ? " minute" : " minutes") : "");
  if (m) return m + (m === 1 ? " minute" : " minutes");
  return "under a minute";
}

let snap = null;
const picks = new Set();

function phaseLine() {
  const now = Math.floor(Date.now() / 1000);
  switch (snap.phase) {
    case "announce": return "entries open in " + human(snap.submit_at - now);
    case "submit":   return "entries close in " + human(snap.vote_at - now);
    case "vote":     return "voting shuts in " + human(snap.results_at - now);
    case "results":  return "done";
    default:         return "called off";
  }
}

function render() {
  document.title = snap.title + " · contest";
  drawTitle(snap.title || "contest");
  if (snap.theme) { $("theme").textContent = snap.theme; $("theme").hidden = false; }
  $("clock").textContent = phaseLine();

  const forum = safeURL(snap.forum);
  $("links").innerHTML = forum
    ? `<a class="chip" href="${esc(forum)}">the forum, in discord</a>` : "";

  const prizes = snap.prizes || [];
  $("prizesWrap").hidden = prizes.length === 0;
  $("prizes").innerHTML = prizes.map((p) => `
    <div class="prize wobble">
      <b>${esc(p.title)}</b>
      <small>from ${esc(p.by)}${p.details ? " · " + esc(p.details) : ""}</small>
    </div>`).join("");

  const entries = snap.entries || [];
  const results = snap.results || [];
  const rankOf = new Map(results.map((r) => [r.id, r]));
  const order = results.length
    ? results.map((r) => entries.find((e) => e.id === r.id)).filter(Boolean)
    : entries;

  $("entriesWrap").hidden = order.length === 0;
  $("entriesHead").textContent = snap.phase === "results"
    ? "how it landed" : order.length + (order.length === 1 ? " entry" : " entries");

  const open = snap.phase === "vote" && !snap.frozen;
  const votable = open && me.signed_in;
  $("grid").innerHTML = order.map((e) => card(e, rankOf.get(e.id), votable)).join("");

  if (votable) {
    for (const el of document.querySelectorAll(".card[data-id]")) {
      el.addEventListener("click", () => toggle(el.dataset.id));
    }
  }
  // The sign in chip is the only prompt on the page, and it is only here
  // while there is something to sign in for.
  if (open && !me.signed_in) {
    $("links").innerHTML += `<a class="chip" href="/c/${encodeURIComponent(slug)}/login">sign in with discord to vote</a>`;
  }

  $("empty").textContent = order.length === 0
    ? (snap.phase === "announce" ? "nothing yet, it has not opened" : "nobody has posted yet")
    : "";

  updateBar();
}

function card(e, r, votable) {
  // Your own entry is not a button. The Worker refuses a self-vote either
  // way, but being told no after tapping is worse than not being able to.
  const mine = votable && me.mine && e.id === me.mine;
  const tag = votable && !mine ? "button" : "div";
  const win = r && r.rank === 1 && snap.phase === "results";
  const link = safeURL(e.link);
  const media = safeURL(e.url);

  let art = "";
  if (e.kind === "image" && media) {
    art = `<img class="art" src="${esc(media)}" alt="${esc(e.title || "entry")} by ${esc(e.by)}" loading="lazy" decoding="async">`;
  } else if (e.kind === "video" && media) {
    art = `<video src="${esc(media)}" controls preload="none"></video>`;
  } else if (e.kind === "audio" && media) {
    art = `<audio src="${esc(media)}" controls preload="none"></audio>`;
  } else if (link) {
    art = `<p class="body">${esc(link)}</p>`;
  } else if (e.body) {
    art = `<p class="body">${esc(e.body)}</p>`;
  }

  return `<${tag} class="card wobble${win ? " win" : ""}" data-id="${esc(e.id)}"
      ${votable ? `aria-pressed="${picks.has(e.id)}"` : ""}>
    ${r ? `<span class="rank">${r.rank}</span>` : ""}
    <figure>${art}</figure>
    <p class="name">${esc(e.title || "untitled")}</p>
    <p class="by">${esc(e.by)}${r ? ` · <span class="votes">${r.votes}</span>` : ""}</p>
  </${tag}>`;
}

let saveTimer = null;

// Optimistic: the pick lands in the UI immediately and the write is coalesced
// a moment later, so tapping through six entries is one request rather than
// six. The server replaces the whole ballot on every call, so a dropped
// intermediate save is not a lost vote, it is a vote that was superseded.
function toggle(id) {
  if (picks.has(id)) picks.delete(id);
  else if (picks.size >= (snap.max_votes || 1)) {
    return setBar("bad", "that is all " + snap.max_votes + " of your picks. unpick one first");
  } else picks.add(id);

  for (const el of document.querySelectorAll(".card[data-id]")) {
    el.setAttribute("aria-pressed", picks.has(el.dataset.id));
  }
  updateBar("busy");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}

async function save() {
  try {
    const res = await fetch(`/api/c/${slug}/vote`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ picks: [...picks] }),
    });
    if (res.status === 401) {
      // The session ran out mid-vote. Say what to do rather than looping.
      return setBar("bad", "your sign in expired, tap sign in again");
    }
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      return setBar("bad", body.error || "that did not save");
    }
    updateBar();
  } catch {
    setBar("bad", "no connection, your picks are not saved");
  }
}

function setBar(state, text) {
  $("bar").classList.add("on");
  $("dot").className = "dot" + (state ? " " + state : "");
  $("barText").textContent = text;
}

function updateBar(state) {
  if (!snap || snap.phase !== "vote" || !me.signed_in || snap.frozen) {
    return $("bar").classList.remove("on");
  }
  const n = picks.size, max = snap.max_votes || 1;
  setBar(state, state === "busy"
    ? "saving"
    : n + " of " + max + " picked" + (n ? ", saved" : ""));
}

async function load() {
  // Both in one go: what the contest is, and who the viewer is. The picks
  // come back from the server rather than from anything stored here, so
  // opening the page on a phone shows the same ballot as on a laptop.
  const [viewRes, meRes] = await Promise.all([
    fetch(`/api/c/${slug}/view`),
    fetch(`/api/c/${slug}/me`, { credentials: "same-origin" }),
  ]);
  if (!viewRes.ok) {
    drawTitle("not here");
    $("clock").textContent = "that link does not go anywhere any more";
    return;
  }
  snap = await viewRes.json();
  me = meRes.ok ? await meRes.json() : { signed_in: false };
  if (me.signed_in && !saveTimer) {
    picks.clear();
    for (const id of me.picks || []) picks.add(id);
  }
  render();
}

drawStickers();
load();

// Two timers, both cheap and both paused when the tab is not being looked
// at. The clock is local arithmetic; the reload is what makes an entry
// posted in discord show up here without anybody refreshing.
setInterval(() => { if (snap && document.visibilityState === "visible") $("clock").textContent = phaseLine(); }, 15000);
setInterval(() => { if (document.visibilityState === "visible") load(); }, 30000);
</script>
</body>
</html>
