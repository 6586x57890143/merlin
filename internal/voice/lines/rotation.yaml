# What Merlin says in a channel that has just rotated, and in one that is
# about to.
#
# Every rotation.intro line MUST state both the reset cadence and, where
# archives are kept for a bounded window, how long they survive. That is not
# a style rule: it is the server's published retention policy, and dropping
# half of it is how the code got this wrong once before. Startup validation
# enforces it, so a line missing {cadence} or {retention} fails the build.
#
# Each key deliberately spans a range rather than settling on one tone. Some
# lines are calm, some are funny, a couple are blunt. Merlin lives in a
# chaotic server and a bot that hits the exact same note every single time
# reads as a machine no matter how good that one note is. Nothing here
# escalates the room, though: she is the cleaner-spoken of the two birds, so
# the edge stays dry rather than crude.

rotation.intro.kept:
  # calm
  - "quiet reset. this channel empties every {cadence}, the archive holds it {retention}, and then there is nothing left. that is the whole policy, no small print 🍵"
  - "fresh start, no ceremony. every {cadence} this place clears, the archive keeps it {retention}, and after that it is genuinely gone"
  - "consider this a fresh nest. clears every {cadence}, archive keeps things {retention}, nothing lingers past that 🪶"
  # neutral
  - "fresh channel, same as the old one. this place wipes itself every {cadence}, and anything that lands in the archive only sticks around {retention} after that before it's properly gone 🌿"
  - "clean slate. everything in here disappears every {cadence}. the archive holds onto it for {retention} and then deletes it for real, not the fake kind of deleted"
  - "new perch, no history. resets every {cadence}, archives last {retention}, and after that there is genuinely nothing left to find"
  - "starting over in here. wipes every {cadence}. the archived copy hangs on {retention} longer, purely so the mods can deal with anything that needs dealing with, and then it goes too"
  - "reset done. {cadence} on the clock, {retention} in the archive after that, then nothing at all"
  # witty
  - "so this channel cleans itself every {cadence}. whatever gets tucked into the archive survives {retention} and then it's gone for good. you're welcome 😌"
  - "the channel has been reincarnated. happens every {cadence}. its previous life sits in the archive for {retention} and then even that goes. very freeing honestly"
  - "everything you're about to say has a shelf life of {cadence}. the archive adds {retention} on top and then it's over"
  - "new channel smell. it goes every {cadence}, the archive babysits it for {retention}, and then whatever cursed thing you posted stops existing. that's a promise, not a threat"
  # blunt
  - "empty channel, as scheduled. it does this every {cadence}, archives get {retention} and no more. post it and forget it exists ✨"
  - "wiped. every {cadence}. the archive holds the wreckage {retention} and then shreds it. say something stupid, it has an expiry date 🔥"

