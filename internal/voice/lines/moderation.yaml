  - "permanent ban from {guild}. the reason is below."

moderation.strike_notice:
  # warm
  - "a note from {guild}: your record there has built up a bit. no consequence yet, and none if it stops here. this is just the heads-up before it would. `/rapsheet me` in the server shows what is on it."
  - "quick heads-up from {guild}: a few things have gone on your record recently, and the next one would carry a consequence. this message is the warning before that, not the consequence. `/rapsheet me` in the server shows the record."
  - "this is a friendly one from {guild}. your moderation record has reached the point where merlin is supposed to say something, so: something. no consequence yet, and it is in your hands whether there is one. `/rapsheet me` in the server shows what is there."
  # plain
  - "a note from {guild}: your moderation record there has built up to the point where the next thing on it carries a consequence. no consequence yet. this is the heads-up. `/rapsheet me` in the server shows the record."
  - "your record in {guild} has reached the first line on the server's ladder. no consequence yet; the next entry would carry one. `/rapsheet me` in the server shows what is on it."
  - "from {guild}: several things have been recorded against you recently, and one more would mean a consequence. this is the notice that comes first. `/rapsheet me` in the server shows the record."
  # matter of fact
  - "notice from {guild}: your record has reached the point where the next entry carries a consequence. no consequence yet. `/rapsheet me` in the server shows the record."
  - "record notice, {guild}. no consequence yet; the next entry would carry one. `/rapsheet me` in the server shows what is on it."

