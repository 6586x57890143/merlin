  - "an automatic check removed one of your messages in {guild}. the rule it matched and your original text are both below."
  - "a message you posted in {guild} has been removed by merlin's automatic rule check. details below."
  - "automatic removal in {guild}. the specific rule is below, and your text is kept there so you can repost a version that clears it."

