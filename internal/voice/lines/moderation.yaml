  - "a moderator in {guild} has removed you from the server. your record there is kept, and you're free to rejoin. the why is below."
  - "heads up: you were kicked from {guild}. it's not a ban, and an invite gets you back in. the reason is below."
  # plain
  - "you have been removed from {guild}. this is not a ban: you can rejoin with an invite. the reason is below."
  - "you were kicked from {guild}. nothing stops you rejoining. the moderator's reason is below."
  - "a moderator has removed you from {guild}. this is a kick, not a ban. the reason given is below."
  # matter of fact
  - "kicked from {guild}. not a ban; rejoining is allowed. reason below."
  - "removed from {guild} by a moderator. the reason is below."

