# Sent as a DM to the member concerned, never posted in a channel.
#
# These are the one place merlin holds back. She is talking to somebody who
# has just been punished, and the register is deliberately the plain one:
# explain what happened, say when it ends, make it clear nothing is lost. A
# joke here reads as gloating to the person on the receiving end, and it is
# the message most likely to end up in a screenshot.
#
# So the variety in this file is a range of warmth, not a range of wit. The
# gentlest line and the most matter-of-fact one say exactly the same thing.
# There is no blunt end here on purpose, because the situation supplies quite
# enough of that on its own.
#
# Every line must name the server and when it ends, so someone in several
# servers is never left guessing which one this is about.

moderation.jail:
  # warm
  - "quick note: you've been jailed in {guild}. your roles are kept as they were and restored {until}."
  - "this is a temporary thing. you're jailed in {guild}, your roles are safe, and they come back {until}."
  - "heads up: you're jailed in {guild} for the moment. nothing is lost, your roles are held and returned {until}."
  # plain
  - "you've been jailed in {guild}. your roles are saved and you'll get them back {until}."
  - "you're jailed in {guild}. this isn't permanent, your roles return {until}."
  - "a moderator in {guild} has jailed you. your roles are stored exactly as they were and come back {until}."
  # matter of fact
  - "a moderator has jailed you in {guild}. nothing has been removed permanently, and your roles return {until}."
  - "you're jailed in {guild} for now. your roles are held exactly as they were and come back {until}."

moderation.release:
  # warm
  - "you're out. your roles in {guild} are back where they were 🌿"
  - "you're out of jail in {guild}, and your roles are back. thanks for waiting"
  - "that's you done. your roles in {guild} are back."
  # plain
  - "released. everything you had in {guild} has been restored."
  - "you're free to go. roles in {guild} restored, nothing lost."
  - "all clear. your roles in {guild} have been put back."
  # matter of fact
  - "you've been released in {guild}. everything you had is back where it was."
  - "done. your roles in {guild} are restored, exactly as they were before."

# Sent to the member whose message merlin's AI moderation removed or edited.
#
# Same plain register as the jail notices above, with one thing on top of
# them: no person decided this. Something they wrote was taken down by
# software, and the line has to own that rather than let them picture a
# moderator reading it and choosing. That honesty is the whole job here: a
# member who thinks they were singled out by a person argues with a person,
# and a member told plainly that a filter did it goes and reads the reason.
#
# So every line names the server, says a rule was matched rather than a
# judgement made, and none of them apologises or lectures. The reason and
# their original text arrive as separate embed fields, so the sentence never
# has to carry either, which is also why nothing here speculates about what
# they did.

moderation.warn:
  # warm
  - "quick note from the mods in {guild}: this is a warning. nothing has been taken away and you are not in any trouble beyond this message. the reason is below."
  - "a moderator in {guild} has given you a warning. it goes on your record, and that is all that has happened. the why is below, and if you want to talk it through, the mods are reachable."
  - "heads up: you have a warning in {guild}. no roles lost, no time out, just a note that something crossed a line. the reason is below."
  # plain
  - "a moderator in {guild} has given you a warning. it is on record, and nothing else has happened. the reason is below."
  - "you have been warned in {guild}. this is a record of it, with the reason below, and nothing further has been done."
  - "this is a warning from the moderators of {guild}. it is noted on your record. the category and reason are below."
  # matter of fact
  - "warning issued in {guild}. on record, no other consequence. reason below."
  - "a warning has been added to your record in {guild}. the moderator's reason is below."

moderation.timeout:
  # warm
  - "you've been timed out in {guild}. you can still read everything, you just can't post for a bit. it ends {until}, and the reason is below."
  - "a moderator in {guild} has put you on a timeout. nothing is removed and no roles are touched; you're on read-only until {until}. the why is below."
  - "quick one: you're timed out in {guild} until {until}. reading is fine, posting isn't, and it lifts on its own. the reason is below."
  # plain
  - "you have been timed out in {guild}. you can read but not post, and it ends {until}. the reason is below."
  - "a timeout has been applied to you in {guild}. it lifts {until}. the moderator's reason is below."
  - "you're on a timeout in {guild} until {until}. it ends by itself; nothing else has been done."
  # matter of fact
  - "timed out in {guild}, ending {until}. reason below."
  - "timeout in {guild}. read-only until {until}. the reason given is below."

moderation.kick:
