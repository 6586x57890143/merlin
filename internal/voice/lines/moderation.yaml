# Sent as a DM to the member concerned, never posted in a channel.
#
# These are the one place Merlin holds back. She is talking to somebody who
# has just been punished, and the register is deliberately the plain one:
# explain what happened, say when it ends, make it clear nothing is lost. A
# joke here reads as gloating to the person on the receiving end, and it is
# the message most likely to end up in a screenshot.
#
# Every line must name the server and when it ends, so someone in several
# servers is never left guessing which one this is about.

moderation.jail:
  - "you've been jailed in {guild}. your roles are saved and you'll get them back {until}."
  - "heads up: you're jailed in {guild} for the moment. nothing is lost, your roles are held and returned {until}."
  - "a moderator in {guild} has jailed you. your roles are stored exactly as they were and come back {until}."
  - "you're jailed in {guild}. this isn't permanent, your roles return {until}."
  - "quick note: you've been jailed in {guild}. your roles are kept as they were and restored {until}."

moderation.release:
  - "you're out. your roles in {guild} are back where they were 🌿"
  - "released. everything you had in {guild} has been restored."
  - "that's you done. your roles in {guild} are back."
  - "you're free to go. roles in {guild} restored, nothing lost."
  - "all clear. your roles in {guild} have been put back."
