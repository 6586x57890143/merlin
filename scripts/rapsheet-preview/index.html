<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rapsheet previews</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #313338; color: #dbdee1; font: 16px/1.375 "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 860px; margin: 0; padding: 24px 16px 80px; zoom: 1.5; }
  h1 { font-size: 20px; color: #f2f3f5; margin: 0 0 24px; }
  .scene { margin: 0 0 40px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #949ba4; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
  .label .tag { background: #404249; color: #dbdee1; border-radius: 4px; padding: 1px 6px; font-size: 11px; text-transform: none; letter-spacing: 0; }
  .msg { display: grid; grid-template-columns: 40px 1fr; gap: 16px; padding: 8px 16px; border-radius: 8px; }
  .msg:hover { background: #2e3035; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #5865f2 url(assets/merlin_avatar.png) center/cover; margin-top: 2px; }
  .head { display: flex; align-items: baseline; gap: 6px; }
  .name { color: #f2f3f5; font-weight: 500; }
  .bot { background: #5865f2; color: #fff; font-size: 10px; font-weight: 600; border-radius: 3px; padding: 0 4px; line-height: 15px; vertical-align: middle; }
  .time { color: #949ba4; font-size: 12px; }
  .content { white-space: pre-wrap; word-break: break-word; }
  .embed { display: grid; grid-template-columns: 1fr auto; gap: 0 16px; max-width: 520px; background: #2b2d31; border-left: 4px solid #4b4c73; border-radius: 4px; padding: 8px 16px 16px 12px; margin-top: 4px; }
  .embed .body { min-width: 0; }
  .embed .title { color: #f2f3f5; font-weight: 600; font-size: 16px; margin-top: 8px; }
  .embed .desc { font-size: 14px; margin-top: 8px; white-space: pre-wrap; word-break: break-word; }
  .embed .fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .embed .field { font-size: 14px; min-width: 0; }
  .embed .field.full { grid-column: 1 / -1; }
  .embed .field .fname { color: #f2f3f5; font-weight: 600; margin-bottom: 2px; }
  .embed .field .fval { white-space: pre-wrap; word-break: break-word; }
  .embed .thumb { width: 80px; height: 80px; object-fit: contain; margin-top: 8px; border-radius: 4px; }
  .quote { border-left: 4px solid #4e5058; padding-left: 12px; margin: 2px 0; display: block; }
  .mention { background: rgba(88,101,242,.3); color: #c9cdfb; border-radius: 3px; padding: 0 2px; font-weight: 500; }
  .ts { background: rgba(255,255,255,.06); border-radius: 3px; padding: 0 2px; }
  code { background: #1e1f22; border-radius: 3px; padding: .2em .3em; font: 85% Consolas, "Courier New", monospace; }
  .buttons { display: flex; gap: 8px; margin-top: 8px; }
  .btn { border: 0; border-radius: 3px; padding: 2px 16px; min-height: 32px; font-size: 14px; font-weight: 500; color: #fff; }
  .btn.danger { background: #da373c; } .btn.secondary { background: #4e5058; } .btn.primary { background: #5865f2; }
  .btn:disabled { opacity: .5; }
  .eph { color: #949ba4; font-size: 12px; margin-top: 6px; display: flex; gap: 6px; align-items: center; }
  .eph .eye { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #949ba4; display: inline-block; }
  .empty { color: #f38ba8; font-style: italic; }
  .surface-dm .avatar { background-color: #23a559; }
</style>
</head>
<body>
<div class="wrap">
  <h1>rapsheet: every user-facing surface</h1>
  <div id="scenes"></div>
</div>
<script>
const MOODS = { 'merlin_ok.png':1, 'merlin_error.png':1, 'merlin_warn.png':1, 'merlin_info.png':1, 'merlin_notice.png':1, 'merlin_idle.png':1 };
const NAMES = { 'u1': 'Dana', 'u2': 'Loud', 'u3': 'u3', 'u4': 'u4', 'u9': 'quiet_one', 'mod-1': 'mod-1', 'mod-2': 'mod-2', 'admin-1': 'admin-1', 'merlin-1': 'merlin' };
const NOW = Date.UTC(2026, 8, 17, 12, 0, 0) / 1000;

function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function rel(ts) {
  const d = ts - NOW, a = Math.abs(d);
  if (a < 60) return 'just now';
  const unit = a < 3600 ? [Math.round(a/60), 'minute'] : a < 86400 ? [Math.round(a/3600), 'hour'] : a < 86400*30 ? [Math.round(a/86400), 'day'] : [Math.round(a/(86400*30)), 'month'];
  const n = unit[0], u = unit[1] + (n === 1 ? '' : 's');
  return d < 0 ? `${n} ${u} ago` : `in ${n} ${u}`;
}
function abs(ts) { const dt = new Date(ts*1000); return dt.toLocaleString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }

function md(s) {
  if (!s) return '';
  let out = esc(s);
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/~~([^~]+)~~/g, '<s>$1</s>');
  out = out.replace(/&lt;@(?:&amp;)?(\w[\w-]*)&gt;/g, (m, id) => `<span class="mention">@${NAMES[id] || id}</span>`);
  out = out.replace(/&lt;#(\w[\w-]*)&gt;/g, (m, id) => `<span class="mention">#${id}</span>`);
  out = out.replace(/&lt;t:(\d+):R&gt;/g, (m, ts) => `<span class="ts">${rel(+ts)}</span>`);
  out = out.replace(/&lt;t:(\d+):f&gt;/g, (m, ts) => `<span class="ts">${abs(+ts)}</span>`);
  out = out.split('\n').map(line => line.startsWith('&gt; ') ? `<span class="quote">${line.slice(5)}</span>` : line).join('\n');
  return out;
}

function embedHTML(e) {
  const color = '#' + (e.color || 0x4b4c73).toString(16).padStart(6, '0');
  let thumb = '';
  if (e.thumbnail && e.thumbnail.url) {
    const f = e.thumbnail.url.replace('attachment://', '');
    thumb = MOODS[f] ? `<img class="thumb" src="assets/${f}" alt="${f}">` : `<div class="thumb empty">missing ${esc(f)}</div>`;
  }
  const fields = (e.fields || []).map(f => `<div class="field ${f.inline ? '' : 'full'}"><div class="fname">${md(f.name)}</div><div class="fval">${md(f.value)}</div></div>`).join('');
  return `<div class="embed" style="border-left-color:${color}"><div class="body">
    ${e.title ? `<div class="title">${md(e.title)}</div>` : ''}
    ${e.description ? `<div class="desc">${md(e.description)}</div>` : ''}
    ${fields ? `<div class="fields">${fields}</div>` : ''}
  </div>${thumb}</div>`;
}

function buttonsHTML(rows) {
  if (!rows || !rows.length) return '';
  return rows.map(row => `<div class="buttons">${(row.components || []).map(b => {
    const style = { 1: 'primary', 2: 'secondary', 4: 'danger' }[b.style] || 'secondary';
    return `<button class="btn ${style}" ${b.disabled ? 'disabled' : ''}>${esc(b.label || '')}</button>`;
  }).join('')}</div>`).join('');
}

fetch('scenes.json?' + Date.now()).then(r => r.json()).then(scenes => {
  const root = document.getElementById('scenes');
  scenes.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'scene surface-' + s.surface;
    div.id = 'scene-' + (i + 1);
    const embeds = (s.embeds || []).map(embedHTML).join('');
    div.innerHTML = `<div class="label"><span>${i + 1}. ${esc(s.title)}</span><span class="tag">${s.surface}</span></div>
      <div class="msg"><div class="avatar"></div><div>
        <div class="head"><span class="name">merlin</span><span class="bot">BOT</span><span class="time">Today at 14:32</span></div>
        ${s.content ? `<div class="content ${s.embeds && s.embeds.length ? '' : 'empty'}">${md(s.content)}</div>` : ''}
        ${embeds}
        ${buttonsHTML(s.components)}
        ${s.ephemeral ? `<div class="eph"><span class="eye"></span> Only you can see this</div>` : ''}
      </div></div>`;
    root.appendChild(div);
  });
});
</script>
</body>
</html>
